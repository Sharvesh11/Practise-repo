<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 10px 8px;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }
        #container>h1{     
            color: red;
        }
        #container #nested-container1 #head2{  
            color: green;
        }
        #container #nested-container1 #head3{
            color: aqua;
        }
       #container #nested-container2>p{
            color: blueviolet;
            font-size: 25px;
        }
        #container #nested-container2 .bluepara{
            color: aqua;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Heading</h1>
        <div id="nested-container1">
            <h1 id="head2">Heading2</h1>
            <h2 id="head3">Heading3</h2>
        </div>
        <div id="nested-container2">
            <p>para</p>
            <p class="bluepara">para</p>
            <p>para</p>
        </div>
    </div>
</body>
</html>
