<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsha</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .container-images{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;  
            margin: auto;
            /* border: 1px solid black; */
        }
        .item{
            width: 30%;
            height: auto;
            display: block;
            border-radius: 5px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
         .item img{
            width: 100%;
            height: auto;
            display: block;
            border-radius: 5px;

        }
        .header>p{
            color: #444444;
        }
        .filters input[type="radio"]{
            display: none;
             padding: 20px;
            gap:30px;
        }
        .filters{
            display: flex;
            padding: 10px;
            gap: 20px;
            justify-content: center;
        }
        .filter-label {
            cursor: pointer;
            transition: background-color 0.3s;
            background-color: #e9ecef;
            border-radius: 20px;
            padding:10px 10px;
        }
        .filter-label:hover{
            background-color: #47b2e4 ;
            color: #fff;
        }
                 
    </style>
</head>
<body>
    <div class="header">
    
    <h2  style="color: #0d6efd; font-size: 32px; font-weight: bold; margin-top: 10px;">PORTFOLIO</h2>
    <p>Necessitatibus eius consequatur ex aliquid fuga eum quidem sint consectetur velit</p>
</div>
<div class="filters">
            <input type="radio" name="filter" id="all">
             <label class="filter-label" for="all">All</label>
             
             <input type="radio" name="filter" id="card">
             <label class="filter-label" for="card">Card</label>

             <input type="radio" name="filter" id="app">
             <label class="filter-label" for="App">App</label>

             <input type="radio" name="filter" id="web">
             <label class="filter-label" for="web">web</label>

</div>
    <div class="container-images">
       
         <div class="item"><img src="portfolio-1.webp"  alt="img not found"></div>
         <div class="item"><img src="portfolio-3.webp"  alt="img not found"></div>
        <div class="item"> <img src="portfolio-4.webp"   alt="img not found"></div>
         <div class="item"><img src="portfolio-portrait-1.webp"  alt="img not found"></div>
         <div class="item"><img src="portfolio-portrait-2.webp" alt="img not found"></div> 
           <div class="item"><img src="portfolio-portrait-3.webp"  alt="img not found"></div>

    </div>
</body>
</html>
