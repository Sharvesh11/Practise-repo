<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsha Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body{
            background-color:#37517e;
            color: white;
            font-family:"Jost", sans-serif;
        }
        h2{
            font-size: 28px;
            font-weight: bold;
            padding: 0;
            margin: 0;
            letter-spacing: 1px;
        }
        .container{
            display: flex;
            justify-content: space-between;
            align-items:center;
            padding: 20px 20px;
           
        }
        .list{
            display: flex;
            list-style-type: none;
            gap: 20px;
        }
        .list li{
            cursor: pointer;
            transition: 0.3s none;       
        }
        .list li:hover{
            color: #47b2e4;
        }
       
        .button{
            list-style: none;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 14px;
            border-radius: 20px 20px 20px;
            background-color: #47b2e4;
            border: 2px solid #47b2e4;
            color: white;
            padding: 6px 20px;
            margin-top:-10px ;
            transition: 0.3s ease;
            font-weight: 500;
        }
        .button:hover{
            background: #47b2e4;
             border-color: #47b2e4;
            color: #fff;
        }
        /* below the goofy nav barrRR */
           .wrap{
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
            min-height:80vh;
             padding: 0 20px;
            gap: 0px;
           }
           .para{
            font-size: 22px;
            font-weight: 600;
            line-height: 1;
            color: #fff;
           }
           .header{
            text-align: left;
            width: 50%;
            padding: 20px;
            margin: 8px;
            transform: none; 
           }
           .hero-img {
             display: flex;
             width: 50%;
            justify-content: center;
             align-items: center;
            padding: 20px;
            }
   
           
           .hero-img img {
            width: 100%;
            max-width: 600px;
            transform: none;
            animation: float 3s ease-in-out infinite;
            }
            @keyframes float {
                0% {transform:translateY(0);}
                50% {transform:translateY(-10px);}
                100%{transform: translateY(0);}
            }
             .button2{
            list-style: none;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 14px;
            border-radius:50px;
            background-color: #47b2e4;
            border: 2px solid #47b2e4;
            color: white;
            padding: 8px 28px;
            transition: 0.3s ease;
            font-weight: 500;
        }
        .button2:hover{
            background: #47b2e4;
             border-color: #47b2e4;
            color: #fff;
        }
        .video{
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 16px;
            margin-left: 15px;
        }
        .video i{
            font-family: "Jost", sans-serif;
            font-size: 32px;
            color:#ffffff;
            margin-right: 8px;
        }
        .video:hover i {
        color: #47b2e4;
        }
        .video:hover  {
        color: #47b2e4;
        }

    </style>
</head>
<body>
   
        <div class="container"> 
            <h2>ARSHA</h2>
            <ul class="list">
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Portfolio</li>
                <li>Team</li>
                <li>Blog</li>
                <li>Dropdown</li>
                <li>Contact</li>
                <a href="#" class="button">Get Started</a>
            </ul>
        </div>
        <div class="wrap">
        <div class="header">
         <h1 style="font-size:48px; font-weight:700; line-height:56px; margin-bottom:20px;">Better Solutions For  Your<br> Business</h1>   
        <div class="para">
         <p> We are team of talented designers making websites with <br>Bootstrap</p>
           <a href="#" class="button2">Get Started</a>
           <a href="#" class="video"><i class="bi bi-play-circle-fill"></i>   Watch Video</a>
        </div>
        </div>
        <div class="hero-img">
            <img src="hero-img.png" alt="Hero.img not found">
        </div>
        </div>
</body>
</html>
